host: localhost:8080
info:
  contact: {}
  description: REST API для управления арендой автомобилей (CRM).
  title: Auto Hub API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Возвращает JWT токен по email и паролю
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Войти в систему
      tags:
      - auth
  /cars:
    get:
      parameters:
      - description: Фильтр по статусу (FREE, RENTED, REPAIR, SOLD)
        in: query
        name: status
        type: string
      - description: Поиск по номеру (ILIKE)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CarsListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Список машин
      tags:
      - cars
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные машины
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCarRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Car'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Создать машину
      tags:
      - cars
  /cars/{id}:
    delete:
      parameters:
      - description: ID машины
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Удалить машину
      tags:
      - cars
    get:
      parameters:
      - description: ID машины
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CarDetailResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Детали машины
      tags:
      - cars
    put:
      consumes:
      - application/json
      parameters:
      - description: ID машины
        in: path
        name: id
        required: true
        type: integer
      - description: Данные машины
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCarRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Car'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Обновить машину
      tags:
      - cars
  /contracts:
    get:
      parameters:
      - description: Фильтр по статусу (ACTIVE, COMPLETED, CANCELLED)
        in: query
        name: status
