basePath: /api
definitions:
  domain.Car:
    properties:
      brand:
        type: string
      created_at:
        type: string
      id:
        type: integer
      inspection_before:
        type: string
      mileage:
        type: integer
      model:
        type: string
      osago_before:
        type: string
      plate_number:
        type: string
      status:
        $ref: '#/definitions/domain.CarStatus'
      updated_at:
        type: string
      vin:
        type: string
      year:
        type: integer
    type: object
  domain.CarStatus:
    enum:
    - FREE
    - RENTED
    - REPAIR
    - SOLD
    type: string
    x-enum-varnames:
    - CarStatusFree
    - CarStatusRented
    - CarStatusRepair
    - CarStatusSold
  domain.Contract:
    properties:
      car_id:
        type: integer
      created_at:
        type: string
      driver_id:
        type: integer
      end_date:
        type: string
      id:
        type: integer
      monthly_payment:
        type: number
      paid_amount:
        type: number
      start_date:
        type: string
      status:
        $ref: '#/definitions/domain.ContractStatus'
      total_amount:
        type: number
      updated_at:
        type: string
    type: object
  domain.ContractStatus:
    enum:
    - ACTIVE
    - COMPLETED
    - CANCELLED
    type: string
    x-enum-varnames:
    - ContractStatusActive
    - ContractStatusCompleted
    - ContractStatusCancelled
  domain.Driver:
