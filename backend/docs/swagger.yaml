      updated_at:
        type: string
    type: object
  domain.DriverStatus:
    enum:
    - ACTIVE
    - INACTIVE
    type: string
    x-enum-varnames:
    - DriverStatusActive
    - DriverStatusInactive
  domain.Fine:
    properties:
      amount:
        type: number
      car_id:
        type: integer
      contract_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      driver_id:
        type: integer
      fine_date:
        type: string
      id:
        type: integer
      paid_at:
        type: string
      status:
        $ref: '#/definitions/domain.FineStatus'
    type: object
  domain.FineStatus:
