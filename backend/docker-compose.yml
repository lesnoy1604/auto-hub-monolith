services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autohub
      POSTGRES_USER: autohub
      POSTGRES_PASSWORD: autohub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autohub"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://autohub:autohub@db:5432/autohub
      JWT_SECRET: dev-secret-key
      PORT: "8080"
      ENV: development
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
